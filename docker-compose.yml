services:
  backend1:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: backend1
    volumes:
      - ./backend/main.py:/app/main.py:ro
    networks:
      - app-net

  backend2:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: backend2
    volumes:
      - ./backend/main.py:/app/main.py:ro
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: frontend-react
    volumes:
      - ./frontend/src:/app/src:ro
    networks:
      - app-net

  haproxy:
    image: haproxy:alpine
    container_name: haproxy-lb
    ports:
      - "80:80"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - backend1
      - backend2
      - frontend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge