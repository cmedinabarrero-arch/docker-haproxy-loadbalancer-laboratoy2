global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s

frontend http_front
    bind *:5000
    default_backend fastapi_backends

backend fastapi_backends
    balance roundrobin
    server backend1 backend1:8000 check
    server backend2 backend2:8000 check
    
