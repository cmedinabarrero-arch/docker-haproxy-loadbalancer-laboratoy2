global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s

frontend http_front
    bind *:80

    # ACL para reglas de enrutamiento
    acl url_api path_beg /api

    # /api hacia los backends FastAPI balanceados
    use_backend fastapi_backends if url_api

    # / (la raiz) y demas rutas hacia la aplicacion frontend
    default_backend frontend_backend

backend frontend_backend
    server frontend frontend:3000 check

backend fastapi_backends
    balance roundrobin
    server backend1 backend1:8000 check
    server backend2 backend2:8000 check
